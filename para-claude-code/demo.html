<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo asistente SIILV-I.A</title>
  <!-- 1. Estilos del asistente -->
  <link rel="stylesheet" href="asistente/asistente.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #F1F3F6; color: #333A44; }
    main { max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
    section.pantalla { background: #fff; padding: 16px 20px; margin: 16px 0; border: 1px solid #D3D8DF; }
  </style>
</head>
<body>
  <main>
    <h1>Demo del asistente</h1>
    <p>Página mínima para probar el paquete. Abre la burbuja de abajo a la derecha.</p>
    <!-- Una sección de ejemplo: el asistente puede citarla y enlazarla -->
    <section class="pantalla" id="descuentos">
      <h1>Gastos que se pueden descontar</h1>
      <p>Los gastos del funeral, los de la última enfermedad no cubiertos por seguros y las deudas sin desgravamen se restan de la masa antes de repartir.</p>
    </section>
  </main>

  <!-- 2. Burbuja y ventana de chat (copiado de asistente/asistente-burbuja.html) -->
  <div id="burbuja"></div>

  <!-- 3. Bloques ocultos y 4. código: ver LEEME-PARA-CLAUDE.md.
       Esta demo los carga con fetch, así que hay que abrirla desde un servidor local
       (por ejemplo: npx serve, o la extensión Live Server de VS Code). -->
  <script>
    Promise.all([
      fetch("asistente/asistente-burbuja.html").then(function(r){ return r.text(); }),
      fetch("asistente/asistente-bloques-ocultos.html").then(function(r){ return r.text(); })
    ]).then(function(partes){
      document.getElementById("burbuja").outerHTML = partes[0];
      var tmp = document.createElement("div");
      tmp.innerHTML = partes[1];
      Array.prototype.forEach.call(tmp.querySelectorAll("script"), function(s){
        var nuevo = document.createElement("script");
        nuevo.type = s.type; nuevo.id = s.id; nuevo.textContent = s.textContent;
        document.body.appendChild(nuevo);
      });
      var js = document.createElement("script");
      js.src = "asistente/asistente.js";
      document.body.appendChild(js);
    });
  </script>
</body>
</html>
